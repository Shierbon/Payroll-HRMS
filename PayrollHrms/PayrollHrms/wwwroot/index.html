
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Payroll HRMS</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
</head>

<body>

    <!-- NAVIGATION -->
    <nav class="navbar navbar-dark bg-primary">
        <div class="container">
            <span class="navbar-brand mb-0 h1">
                Payroll HRMS
            </span>
        </div>
    </nav>

    <div class="container mt-4">
        <!-- PAGE HEADER -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3>Employee Management</h3>
            <button class="btn btn-primary"
                    onclick="openCreateModal()">
                + Add Employee
            </button>
        </div>

        <!-- TOTAL EMPLOYEES -->
        <div class="row mb-4">
            <div class="col-md-4">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h6>Total Employees</h6>
                        <h2 id="totalEmployees">0</h2>
                    </div>
                </div>
            </div>
        </div>

        <!-- EMPLOYEE TABLE -->
        <div class="card shadow-sm mb-4">
            <div class="card-header bg-white">
                <h5 class="mb-0">Employee List</h5>
            </div>

            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-bordered table-hover">
                        <thead class="table-light">

                            <tr>
                                <th>Employee Number</th>
                                <th>Employee Name</th>
                                <th>Date of Birth</th>
                                <th>Daily Rate</th>
                                <th>Working Days</th>
                                <th>Actions</th>
                            </tr>

                        </thead>
                        <tbody id="employeeTableBody">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- EMPLOYEE MODAL -->
        <div class="modal fade"
             id="employeeModal"
             tabindex="-1">

            <div class="modal-dialog modal-lg">
                <div class="modal-content">

                    <div class="modal-header">
                        <h5 class="modal-title"
                            id="employeeModalTitle">

                            Add Employee

                        </h5>

                        <button type="button"
                                class="btn-close"
                                data-bs-dismiss="modal">
                        </button>
                    </div>

                    <div class="modal-body">
                        <form id="employeeForm">
                            <input type="hidden"
                                   id="employeeId">

                            <div class="row">
                                <div class="col-md-4 mb-3">
                                    <label class="form-label">
                                        Last Name
                                    </label>
                                    <input type="text"
                                           id="lastName"
                                           class="form-control"
                                           required>
                                </div>

                                <div class="col-md-4 mb-3">
                                    <label class="form-label">
                                        First Name
                                    </label>
                                    <input type="text"
                                           id="firstName"
                                           class="form-control"
                                           required>
                                </div>

                                <div class="col-md-4 mb-3">
                                    <label class="form-label">
                                        Middle Name
                                    </label>
                                    <input type="text"
                                           id="middleName"
                                           class="form-control">
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-4 mb-3">
                                    <label class="form-label">
                                        Date of Birth
                                    </label>
                                    <input type="date"
                                           id="dateOfBirth"
                                           class="form-control"
                                           required>
                                </div>

                                <div class="col-md-4 mb-3">
                                    <label class="form-label">
                                        Daily Rate
                                    </label>
                                    <input type="number"
                                           id="dailyRate"
                                           class="form-control"
                                           min="0.01"
                                           step="0.01"
                                           required>
                                </div>

                                <div class="col-md-4 mb-3">
                                    <label class="form-label">
                                        Working Days
                                    </label>
                                    <select id="workingDays"
                                            class="form-select"
                                            required>
                                        <option value="">
                                            Select Schedule
                                        </option>
                                        <option value="MWF">
                                            Monday / Wednesday / Friday
                                        </option>
                                        <option value="TTHS">
                                            Tuesday / Thursday / Saturday
                                        </option>
                                    </select>
                                </div>
                            </div>

                        </form>
                    </div>

                    <div class="modal-footer">
                        <button type="button"
                                class="btn btn-secondary"
                                data-bs-dismiss="modal">
                            Cancel
                        </button>
                        <button type="submit"
                                form="employeeForm"
                                class="btn btn-primary">
                            Save Employee
                        </button>
                    </div>

                </div>
            </div>

        </div>

        <!-- PAYROLL COMPUTATION -->
        <div class="card shadow-sm mb-5">
            <div class="card-header bg-white">
                <h5 class="mb-0">
                    Compute Salary
                </h5>
            </div>

            <div class="card-body">
                <form id="payrollForm">
                    <div class="row">

                        <div class="col-md-4 mb-3">
                            <label class="form-label">
                                Employee
                            </label>
                            <select id="payrollEmployee"
                                    class="form-select"
                                    required>
                                <option value="">
                                    Select Employee
                                </option>
                            </select>
                        </div>

                        <div class="col-md-3 mb-3">
                            <label class="form-label">
                                Starting Date
                            </label>
                            <input type="date"
                                   id="startDate"
                                   class="form-control"
                                   required>
                        </div>

                        <div class="col-md-3 mb-3">
                            <label class="form-label">
                                Ending Date
                            </label>
                            <input type="date"
                                   id="endDate"
                                   class="form-control"
                                   required>
                        </div>

                        <div class="col-md-2 mb-3 d-flex align-items-end">
                            <button type="submit"
                                    class="btn btn-success w-80">
                                Compute
                            </button>
                            &nbsp;
                            <button type="button"
                                    class="btn btn-danger w-100"
                                    onclick="clearPayroll()">
                                Clear
                            </button>
                        </div>
                    </div>
                </form>

                <!-- PAYROLL RESULT -->
                <div id="payrollResult"
                     class="payroll-result d-none">

                    <h5>Payroll Result</h5>

                    <hr>
                    <p>
                        Employee:
                        <strong id="resultEmployee"></strong>
                    </p>

                    <p>
                        Total Working Days:
                        <strong id="resultWorkingDays"></strong>
                    </p>

                    <p>
                        Basic Pay:
                        <strong id="resultBasicPay"></strong>
                    </p>

                    <p>
                        Birthday Pay:
                        <strong id="resultBirthdayPay"></strong>
                    </p>
                    <hr>

                    <h4>
                        Take-Home Pay:
                        <span id="resultTakeHomePay"
                              class="text-success">
                        </span>
                    </h4>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/app.js"></script>

</body>
</html>
